[workspace]
members = [
    "crates/protocol",
    "crates/core",
    "crates/server",
    "crates/client",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.4.3"
edition = "2021"
rust-version = "1.75"
authors = ["SaabAudioMixingConsoleStreaming Contributors"]
license = "MIT"

[workspace.dependencies]
# Internal workspace crates
protocol = { path = "crates/protocol" }
audio_core = { path = "crates/core" }
server = { path = "crates/server" }
client = { path = "crates/client" }

# Async & Networking
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }

# CLI & Configuration
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
dirs = "6.0"

# Serialization & Binary Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
byteorder = "1.5"

# Audio & Lock-free Data Structures
cpal = "0.15"
ringbuf = "0.4"
crossbeam-channel = "0.5"

# Error Handling & Logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UI Framework (for client)
iced = { version = "0.12", default-features = false, features = ["tokio", "canvas", "wgpu"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
