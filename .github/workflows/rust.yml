name: Rust CI & Release

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, Lint & Test
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify Formatting
        run: cargo fmt --check

      - name: Clippy Linter
        run: cargo clippy --workspace -- -D warnings

      - name: Cargo Build
        run: cargo build --workspace --verbose

      - name: Cargo Test
        run: cargo test --workspace --verbose

  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      needs_release: ${{ steps.check.outputs.needs_release }}
      version: ${{ steps.check.outputs.version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if tag exists
        id: check
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          TAG_NAME="v${VERSION}"
          
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Version ${VERSION} already released (tag ${TAG_NAME} exists)."
            echo "needs_release=false" >> $GITHUB_OUTPUT
          else
            echo "New version ${VERSION} detected (tag ${TAG_NAME} does not exist)."
            echo "needs_release=true" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          fi

  release:
    name: Create GitHub Release
    needs: [test, check-version]
    if: needs.check-version.outputs.needs_release == 'true' && github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Git Tag & Push
        run: |
          TAG_NAME="${{ needs.check-version.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Generate Release Notes with Contributors
        run: |
          TAG_NAME="${{ needs.check-version.outputs.tag_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CONTRIBUTORS=$(git log "${PREV_TAG}..${TAG_NAME}" --format="* %an" | grep -v '\[bot\]' | sort -u)
          else
            CONTRIBUTORS=$(git log "${TAG_NAME}" --format="* %an" | grep -v '\[bot\]' | sort -u)
          fi

          {
            echo "## Contributors in this Release"
            echo ""
            echo "$CONTRIBUTORS"
            echo ""
          } > RELEASE_BODY.md

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag_name }}
          body_path: RELEASE_BODY.md
          generate_release_notes: true
