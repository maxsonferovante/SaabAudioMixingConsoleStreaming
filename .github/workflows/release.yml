name: Release & Distribution

on:
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      needs_release: ${{ steps.check.outputs.needs_release }}
      version: ${{ steps.check.outputs.version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Version Tag
        id: check
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          TAG_NAME="v${VERSION}"
          
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Version ${VERSION} already released (${TAG_NAME} exists)."
            echo "needs_release=false" >> $GITHUB_OUTPUT
          else
            echo "New version ${VERSION} detected (${TAG_NAME} does not exist)."
            echo "needs_release=true" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          fi

  build-android:
    name: Build Android Node (aarch64)
    needs: [check-version]
    if: needs.check-version.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Build Android Client Binary
        run: |
          cargo ndk -t arm64-v8a -P 31 -- build --package client --release
          mkdir -p dist
          cp target/aarch64-linux-android/release/client dist/client-aarch64-linux-android

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: dist/client-aarch64-linux-android

  build-macos:
    name: Build macOS Packages (ARM64 & x86_64)
    needs: [check-version]
    if: needs.check-version.outputs.needs_release == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build and Package Binaries
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p dist

          # Build ARM64
          cargo build --release --target aarch64-apple-darwin --bin saab --bin server
          tar -czvf "dist/saab-v${VERSION}-macos-arm64.tar.gz" -C target/aarch64-apple-darwin/release saab server

          # Build x86_64
          cargo build --release --target x86_64-apple-darwin --bin saab --bin server
          tar -czvf "dist/saab-v${VERSION}-macos-x86_64.tar.gz" -C target/x86_64-apple-darwin/release saab server

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/

  publish-release:
    name: Publish Release & Homebrew Formula
    needs: [check-version, build-android, build-macos]
    if: needs.check-version.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Git Tag & Push
        run: |
          TAG_NAME="${{ needs.check-version.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Generate Formula & Checksums
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          cd release-assets
          
          ARM64_TAR="saab-v${VERSION}-macos-arm64.tar.gz"
          X86_64_TAR="saab-v${VERSION}-macos-x86_64.tar.gz"

          ARM64_SHA=$(sha256sum "$ARM64_TAR" | awk '{print $1}')
          X86_64_SHA=$(sha256sum "$X86_64_TAR" | awk '{print $1}')
          sha256sum * > checksums.txt

          cat << EOF > saab.rb
          class Saab < Formula
            desc "Ultra-low-latency distributed audio mixing console CLI for macOS and Android"
            homepage "https://github.com/maxsonferovante/SaabAudioMixingConsoleStreaming"
            version "${VERSION}"
            license "MIT"

            if Hardware::CPU.arm?
              url "https://github.com/maxsonferovante/SaabAudioMixingConsoleStreaming/releases/download/v${VERSION}/${ARM64_TAR}"
              sha256 "${ARM64_SHA}"
            else
              url "https://github.com/maxsonferovante/SaabAudioMixingConsoleStreaming/releases/download/v${VERSION}/${X86_64_TAR}"
              sha256 "${X86_64_SHA}"
            end

            def install
              bin.install "saab"
              bin.install "server" if File.exist?("server")
            end

            def caveats
              <<~EOS
                Saab captures macOS system audio via CoreAudio HAL loopback drivers.
                If you do not have BlackHole 16ch installed yet, run:
                  brew install --cask blackhole-16ch
              EOS
            end

            test do
              assert_match "saab #{version}", shell_output("#{bin}/saab --version")
            end
          end
          EOF
          cd ..

      - name: Generate Release Notes
        run: |
          TAG_NAME="${{ needs.check-version.outputs.tag_name }}"
          VERSION="${{ needs.check-version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CONTRIBUTORS=$(git log "${PREV_TAG}..${TAG_NAME}" --format="* %an" | grep -v '\[bot\]' | sort -u)
          else
            CONTRIBUTORS=$(git log "${TAG_NAME}" --format="* %an" | grep -v '\[bot\]' | sort -u)
          fi

          {
            echo "# Release ${TAG_NAME}"
            echo ""
            echo "## Homebrew Installation"
            echo "\`\`\`bash"
            echo "# Tap and install directly from this repository:"
            echo "brew tap maxsonferovante/saab https://github.com/maxsonferovante/SaabAudioMixingConsoleStreaming"
            echo "brew install saab"
            echo ""
            echo "# Or install directly via the formula URL:"
            echo "brew install https://raw.githubusercontent.com/maxsonferovante/SaabAudioMixingConsoleStreaming/main/Formula/saab.rb"
            echo "\`\`\`"
            echo ""
            echo "## Release Assets"
            echo "- \`saab-v${VERSION}-macos-arm64.tar.gz\` (macOS Apple Silicon M1/M2/M3/M4)"
            echo "- \`saab-v${VERSION}-macos-x86_64.tar.gz\` (macOS Intel)"
            echo "- \`client-aarch64-linux-android\` (Android 12+ Oboe AAudio Daemon)"
            echo "- \`saab.rb\` (Homebrew Formula)"
            echo "- \`checksums.txt\` (SHA256 digests)"
            echo ""
            echo "## Contributors in this Release"
            echo "$CONTRIBUTORS"
          } > RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag_name }}
          body_path: RELEASE_BODY.md
          files: |
            release-assets/client-aarch64-linux-android
            release-assets/saab-v${{ needs.check-version.outputs.version }}-macos-arm64.tar.gz
            release-assets/saab-v${{ needs.check-version.outputs.version }}-macos-x86_64.tar.gz
            release-assets/saab.rb
            release-assets/checksums.txt
          generate_release_notes: true
