name: Auto Open Pull Request

on:
  push:
    branches-ignore:
      - main
      - master
      - develop

permissions:
  pull-requests: write
  contents: write

jobs:
  create-pr:
    name: Create PR to main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Processing branch: $BRANCH_NAME"
          
          # Check if an open PR already exists for this branch targeting main
          EXISTING_PR=$(gh pr list --base main --head "$BRANCH_NAME" --state open --json number -q '.[0].number')
          
          if [ -n "$EXISTING_PR" ]; then
            echo "Pull Request already exists: PR #$EXISTING_PR. Skipping creation."
          else
            echo "No open PR found. Creating new PR targeting main branch..."
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "feat: Merge $BRANCH_NAME into main" \
              --body "This Pull Request was automatically created by the Auto Open PR workflow upon detecting pushes to \`$BRANCH_NAME\`."
          fi
