name: Auto Open Pull Request

on:
  push:
    branches-ignore:
      - main
      - master

permissions:
  pull-requests: write
  contents: write

jobs:
  create-pr-to-develop:
    name: Auto PR to develop
    if: github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name != 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Processing feature branch: $BRANCH_NAME targeting develop"
          
          EXISTING_PR=$(gh pr list --base develop --head "$BRANCH_NAME" --state open --json number -q '.[0].number')
          
          if [ -n "$EXISTING_PR" ]; then
            echo "Pull Request already exists: PR #$EXISTING_PR. Skipping creation."
          else
            echo "Creating new PR: $BRANCH_NAME -> develop..."
            PR_BODY="This Pull Request was automatically created upon detecting pushes to \`${BRANCH_NAME}\` targeting the \`develop\` branch."
            gh pr create \
              --base develop \
              --head "$BRANCH_NAME" \
              --title "feat: Merge $BRANCH_NAME into develop" \
              --body "$PR_BODY" || true
          fi

  create-pr-develop-to-main:
    name: Auto PR develop to main
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request from develop to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking diff between develop and main..."
          git fetch origin main
          DIFF_COUNT=$(git rev-list --count origin/main..origin/develop || echo "0")
          
          if [ "$DIFF_COUNT" -eq "0" ]; then
            echo "develop and main are identical. No PR needed."
            exit 0
          fi
          
          EXISTING_PR=$(gh pr list --base main --head develop --state open --json number -q '.[0].number')
          
          if [ -n "$EXISTING_PR" ]; then
            echo "Release PR develop -> main already exists: PR #$EXISTING_PR."
          else
            echo "Creating release PR: develop -> main..."
            RELEASE_BODY="Release candidate ready for production deployment from \`develop\` to \`main\`."
            gh pr create \
              --base main \
              --head develop \
              --title "release: Merge develop into main" \
              --body "$RELEASE_BODY" || true
          fi
